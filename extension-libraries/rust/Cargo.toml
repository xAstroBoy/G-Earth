[package]
name = "gearth-extension"
version = "0.1.0"
edition = "2021"
description = "Write G-Earth extensions in Rust. Implements the G-Earth remote (network) extension protocol using only the standard library, so a `cargo build --release` binary is a launchable native G-Earth extension."
license = "MIT"
repository = "https://github.com/xAstroBoy/G-Earth"
keywords = ["gearth", "habbo", "extension", "packet", "proxy"]
categories = ["network-programming"]

# The crate is intentionally dependency-free (std only) so `cargo build` is trivial
# and the produced .exe has no runtime requirements.

[lib]
name = "gearth_extension"
path = "src/lib.rs"

[[example]]
name = "logger"
path = "examples/logger.rs"

[profile.release]
opt-level = 3
lto = true
